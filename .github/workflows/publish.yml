name: Publish package

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run while it may be uploading an immutable package version.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.12'
      - name: Validate version and release source
        run: python3 .github/scripts/validate_release.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: github.event_name != 'pull_request'
        with:
          node-version: '22'
          package-manager-cache: false
      - run: uv sync --locked --group release --extra dev --extra hf-tokenizer --extra sglang-tracing
      - name: Check release source
        if: github.event_name != 'pull_request'
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync python -m pytest -q -ra --tb=short
      - name: Build source distribution and wheel from it
        run: uv run --no-sync python -m build --no-isolation
      - name: Validate package metadata
        run: uv run --no-sync twine check --strict dist/*
      - name: Test installed wheel outside the source checkout
        run: |
          uv venv "$RUNNER_TEMP/package-smoke"
          uv pip install --python "$RUNNER_TEMP/package-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-smoke/bin/python" "$GITHUB_WORKSPACE/.github/scripts/smoke_package.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.repository == '0dust/giraffe' && github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/giraffe-llm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.repository == '0dust/giraffe' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/giraffe-llm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
