[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "giraffe-llm"
version = "0.1.0a1"
description = "A built-in acceptance test suite for self-hosted LLM services"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.11,<3", "PyYAML>=6,<7", "jsonschema>=4.23,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "transformers>=4.45,<6", "jinja2>=3.1,<4", "tiktoken>=0.8,<1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/0dust/giraffe"
Documentation = "https://github.com/0dust/giraffe#readme"
Repository = "https://github.com/0dust/giraffe"
Issues = "https://github.com/0dust/giraffe/issues"
Releases = "https://github.com/0dust/giraffe/releases"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11"]
sglang-tracing = ["opentelemetry-proto>=1.40,<2"]

[dependency-groups]
release = ["build==1.6.1", "hatchling==1.32.4", "twine==7.0.0"]

[project.scripts]
giraffe = "giraffe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/giraffe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
