config_version: 2
# LMDeploy: edit the endpoint and served model ID before running.
# Omitting checks uses the shared access, serving, correctness, first_output defaults.
targets:
  - name: lmdeploy
    url: http://127.0.0.1:23333/v1
    model: replace-with-served-model-id
    metrics_profile: lmdeploy
    metrics_url: http://127.0.0.1:23333/metrics
