config_version: 2
# SGLang: edit the endpoint and served model ID before running.
# Omitting checks uses the shared access, serving, correctness, first_output defaults.
targets:
  - name: sglang
    url: http://127.0.0.1:30000/v1
    model: replace-with-served-model-id
    metrics_profile: sglang
    metrics_url: http://127.0.0.1:30000/metrics
