config_version: 2
# vLLM: edit the endpoint and served model ID before running.
# Omitting checks uses the shared access, serving, correctness, first_output defaults.
targets:
  - name: vllm
    url: http://127.0.0.1:8000/v1
    model: replace-with-served-model-id
    metrics_profile: vllm-v1
    metrics_url: http://127.0.0.1:8000/metrics
