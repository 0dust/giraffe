config_version: 2
# Match the URL, model and server limits to your deployment.
targets:
- name: vllm
  url: http://127.0.0.1:8000/v1
  model: your-served-model
  identity:
    runtime: vllm
concurrency: 2
default_concurrency: 2
max_requests: 400
max_duration_seconds: 900
request_timeout_seconds: 120
max_output_tokens: 128
context_limit: 4096
samples: 6
sustained_seconds: 30
request_options:
  temperature: 0
structured_json: false
metrics: false
retention: failures
limits:
  first_output_ms: 60000
  latency_ms: 90000
  stream_gap_ms: 10000
  min_output_tokens_per_second: 1
  recovery_max_ratio: 2
  max_error_rate: 0
  min_correctness: 1
  regression_percent: 20
  min_samples: 5
concurrent_load:
  schedule:
    levels:
    - 1
    - 2
