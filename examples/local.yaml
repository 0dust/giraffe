config_version: 2
# Match the URL, model and server limits to your deployment.
targets:
- name: local
  url: http://127.0.0.1:11434/v1
  model: qwen2.5:7b-instruct
concurrency: 2
default_concurrency: 2
max_requests: 400
max_duration_seconds: 300
request_timeout_seconds: 30
max_output_tokens: 128
context_limit: 4096
samples: 6
sustained_seconds: 5
request_options:
  temperature: 0
structured_json: true
retention: failures
# Load test uses separate load_test.pass_criteria: 2,000 ms first answer,
# 30,000 ms completion, 0% errors, 100% correct scored answers, 5 valid responses.
# It has no stream-pause or generation-speed limit unless set there.
# The limits below apply to other checks.
limits:
  first_output_ms: 5000
  latency_ms: 15000
  stream_gap_ms: 3000
  recovery_max_ratio: 2
  max_error_rate: 0
  min_correctness: 1
  regression_percent: 20
  min_samples: 5
load_test:
  patterns:
    concurrent:
      levels: [1, 2]
