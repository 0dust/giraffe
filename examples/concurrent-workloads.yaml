config_version: 2
# Compare three input/output shapes at two simultaneous-request levels.
targets:
  - name: local
    url: http://127.0.0.1:8080/v1
    # Set context_limit below to the server's configured context window.
    deployment:
      serving:
        context_limit: 4096
    model: replace-with-served-model-id
checks: [load]
concurrency: 2
context_limit: 4096
load_test:
  workloads:
    combinations:
      selected: [short_short, long_short, short_long]
  patterns:
    concurrent:
      levels: [1, 2]
    constant:
      enabled: false
  schedule:
    duration_seconds: 10
