config_version: 2
# Test Poisson arrivals. Set rates and acceptance limits for your deployment.
targets:
  - name: local
    url: http://127.0.0.1:11434/v1
    # Set context_limit below to the server's configured context window.
    deployment:
      serving:
        context_limit: 4096
    model: qwen2.5:7b-instruct
checks: [load]
concurrency: 32
context_limit: 4096
load_test:
  workloads:
    combinations:
      selected: [short_short]
  patterns:
    concurrent:
      enabled: false
    constant:
      enabled: false
    poisson:
      enabled: true
      seed: 42
    rates: [1, 2, 4]
  schedule:
    duration_seconds: 20
  pass_criteria:
    max_first_answer_ms: 1500
    max_completion_ms: 10000
