config_version: 2
# Optional diagnostics beyond the four default checks; edit for your endpoint.
targets:
  - name: local
    url: http://127.0.0.1:11434/v1
    model: llama3.2:3b
    metrics_profile: ollama
checks: [prefix, sessions, consistency]
context_limit: 16384
max_output_tokens: 128
prefix:
  prefix_chars: 8192
  repeats: 6
sessions:
  modes: [fixed, live]
  sessions: 5
  concurrency: 2
  max_tokens: 64
consistency:
  repetitions: 6
  shapes: [short, long]
  levels: [1, 2]
  temperature: 0
  seed: 17
limits:
  first_output_ms: 60000
  latency_ms: 90000
