config_version: 2
targets:
  - name: local
    url: http://localhost:11434/v1
    model: your-model
    tokenizer: builtin
checks: [sessions]
concurrency: 4
max_requests: 100
max_duration_seconds: 120
request_timeout_seconds: 10
context_limit: 16384
sessions:
  profile: performance
  modes: [live]
  sessions: 8
  concurrency: 4
  max_tokens: 128
  sampling:
    seed: 42
    think_time_seconds:
      values: [0, 1, 5]
      weights: [1, 3, 1]
    input_tokens:
      values: [128, 512]
    output_tokens:
      values: [64, 128]
      weights: [3, 1]
    turn_count:
      values: [2, 3]
  workloads:
    - name: coding
      turns:
        - Write a Python function to remove duplicate items from a list.
        - Extend your previous function to handle unhashable items.
        - Add tests for your previous solution, including empty input.
    - name: chat
      turns:
        - Suggest a weekend picnic plan.
        - Adapt your previous plan for rainy weather.
        - Turn our discussion into a checklist.
