config_version: 2
# TGI: edit the endpoint and served model ID before running.
# Omitting checks uses the shared access, serving, correctness, first_output defaults.
targets:
  - name: tgi
    url: http://127.0.0.1:8080/v1
    model: replace-with-served-model-id
    metrics_profile: tgi
    metrics_url: http://127.0.0.1:8080/metrics
