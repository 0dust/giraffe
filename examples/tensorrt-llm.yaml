config_version: 2
# Match the URL, model and server limits to your deployment.
targets:
- name: tensorrt-llm
  url: http://127.0.0.1:8000/v1
  model: replace-with-served-model-id
  deployment:
    discovery: tensorrt-llm
    runtime:
      engine: tensorrt-llm
  metrics_profile: tensorrt-llm
checks:
- access
- serving
- first_output
- generation
- capacity
- concurrency
- context
- correctness
- json
- cancellation
- recovery
- gpu
- arrivals
- prefix
- sessions
- consistency
- tools
concurrency: 2
default_concurrency: 2
max_requests: 700
max_duration_seconds: 1800
request_timeout_seconds: 60
max_output_tokens: 128
context_limit: 4096
samples: 5
sustained_seconds: 5
retention: failures
request_options:
  temperature: 0
# On import, capacity, concurrency and arrivals become separate Load tests.
# Capacity/arrivals inherit the limits below. Concurrency instead uses
# per-response defaults: 2,000 ms first answer, 30,000 ms completion,
# 0% errors, 100% correct scored answers and 5 valid responses; no stream-pause
# or generation-speed limit. Review the normalized config with validate
# --show-config before adjusting these independent Load test criteria.
limits:
  min_samples: 5
  first_output_ms: 10000
  latency_ms: 60000
  stream_gap_ms: 10000
  min_output_tokens_per_second: 1
  max_error_rate: 0
  min_correctness: 1
test_options: {}
concurrent_load:
  profile:
    short:
      input_tokens: 128
      output_tokens: 16
    medium:
      input_tokens: 512
      output_tokens: 48
    long:
      input_tokens: 2048
      output_tokens: 96
  combinations:
    enabled: true
    selected:
    - short_short
    - short_medium
    - short_long
    - medium_short
    - medium_medium
    - medium_long
    - long_short
    - long_medium
    - long_long
  mixed:
    enabled: false
    shares:
      short_short: 60
      long_short: 20
      short_long: 20
    seed: null
  interference:
    enabled: false
    trigger: first_output
    trigger_chunks: 5
    max_slowdown: 1.5
  stress:
    enabled: true
    large_input: true
    large_output: true
    min_output_percent: 80
  schedule:
    levels:
    - 1
    - 2
    duration_seconds: 10
  pass_criteria:
    first_output_p95_ms: null
    response_p95_ms: null
    max_error_percent: 0
    min_correct_percent: 100
    min_valid_responses: 5
  input_token_tolerance: 0.1
  calibration_attempts: 3
