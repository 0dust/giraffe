name: Giraffe LLM checks
description: Check an OpenAI-compatible endpoint and upload the run report.
inputs:
  url:
    description: OpenAI-compatible base URL; optional with config.
    required: false
  model:
    description: Served model; discovered when omitted.
    required: false
  checks:
    description: Comma-separated check IDs; uses config defaults when omitted.
    required: false
  config:
    description: Path to a Giraffe YAML configuration.
    required: false
  baseline:
    description: Baseline run directory or report JSON.
    required: false
  fail-on:
    description: "inconclusive gates on fail/inconclusive; fail gates on fail; never accepts both. Errors remain nonzero."
    default: inconclusive
  python-version:
    description: Python version to install.
    default: '3.12'
  version:
    description: giraffe-llm package version, or latest.
    default: latest
outputs:
  run-dir:
    description: Run report directory.
    value: ${{ steps.run.outputs.run-dir }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Giraffe
      shell: bash
      env:
        GIRAFFE_VERSION: ${{ inputs.version }}
      run: |
        python - <<'PY'
        import os
        import subprocess
        import sys

        version = os.environ['GIRAFFE_VERSION'].strip()
        package = 'giraffe-llm' if version in {'', 'latest'} else 'giraffe-llm==' + version
        subprocess.run([sys.executable, '-m', 'pip', 'install', package], check=True)
        PY
    - name: Run checks
      id: run
      shell: bash
      env:
        GIRAFFE_URL: ${{ inputs.url }}
        GIRAFFE_MODEL: ${{ inputs.model }}
        GIRAFFE_CHECKS: ${{ inputs.checks }}
        GIRAFFE_CONFIG: ${{ inputs.config }}
        GIRAFFE_BASELINE: ${{ inputs.baseline }}
        GIRAFFE_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        import subprocess
        import tempfile

        root = Path(tempfile.mkdtemp(prefix='giraffe-action-', dir=os.environ['RUNNER_TEMP']))
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'artifact-dir={root}\nartifact-name={root.name}\nrun-dir={root / "run"}\n')
        command = ['giraffe', 'run', '--quiet', '--output', str(root / 'run'),
                   '--junit', str(root / 'junit.xml'), '--summary-md', str(root / 'summary.md')]
        for option in ('url', 'model', 'checks', 'config', 'baseline', 'fail-on'):
            value = os.environ['GIRAFFE_' + option.upper().replace('-', '_')]
            if value:
                command.append('--' + option + '=' + value)
        raise SystemExit(subprocess.run(command).returncode)
        PY
    - name: Append job summary
      if: always()
      shell: bash
      env:
        GIRAFFE_ARTIFACT_DIR: ${{ steps.run.outputs.artifact-dir }}
      run: |
        python - <<'PY'
        import os
        from pathlib import Path

        root = os.environ['GIRAFFE_ARTIFACT_DIR']
        summary = Path(root) / 'summary.md' if root else None
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
            output.write(summary.read_text() if summary and summary.is_file()
                         else 'Giraffe could not produce a summary; see the action logs.\n')
        PY
    - name: Upload run artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.run.outputs.artifact-name || 'giraffe-unavailable' }}
        path: ${{ steps.run.outputs.artifact-dir }}
        if-no-files-found: warn
