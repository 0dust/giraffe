<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0A0A0B">
  <title>Giraffe · Endpoint checks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23f1c65c'/%3E%3Cpath d='M13 29V12h12v7h-6v10M15 9V6m8 3V6' fill='none' stroke='%2321251f' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("giraffe-theme")==="light"?"light":"dark";}catch{}</script>
  <link rel="stylesheet" href="/static/styles.css?v=20261016-reticulate1">
  <script type="module" src="/static/app.js?v=20261016-reticulate1"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
   <div class="app-header-inner">
    <a class="brand" href="#new" aria-label="Giraffe home"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M7 26V8h16v9H14v9M10 5V2m10 3V2" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/><circle cx="19" cy="11" r="1.3" fill="currentColor"/></svg><span>giraffe<span class="brand-dot">.</span></span></a>
    <nav aria-label="Main navigation">
      <a href="#runs" id="nav-runs" aria-label="Run history"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h8"/></svg>Runs<span id="run-count" class="nav-count" hidden></span></a>
      <a href="#new" id="nav-new" aria-label="New run"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>New run</a>
    </nav>
    <div class="app-shell-footer">
      <div class="runner-indicator"><span class="connection-dot" aria-hidden="true"></span><span>Local runner<small id="runner-location">Your machine</small></span></div>
      <button class="theme-toggle" data-action="theme" aria-label="Switch to light theme">☼</button><span class="shell-version">Giraffe <span id="suite-version">v0.1.0</span></span>
    </div>
   </div>
  </header>
  <div class="workspace">
    <div class="workspace-path"><div id="breadcrumb">New run</div><a id="active-run-link" class="active-run-link" hidden></a><button class="command-trigger" data-action="commands" aria-label="Open command palette">Search commands <kbd>⌘ K</kbd></button></div>
    <div id="connection-error" class="connection-error" role="status" hidden></div>
    <main id="main" tabindex="-1"><div class="loading">Loading local workspace…</div></main>
  </div>
  <dialog id="command-dialog" aria-labelledby="command-title"></dialog>
  <dialog id="dataset-dialog" aria-labelledby="dataset-dialog-title"></dialog>
  <dialog id="request-dialog" aria-labelledby="request-title"></dialog>
  <dialog id="baseline-dialog" aria-labelledby="baseline-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p>Enable JavaScript to run checks and review results in Giraffe.</p></noscript>
</body>
</html>
