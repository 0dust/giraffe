<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#09090A">
  <title>Giraffe · Endpoint checks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23F7C25A'/%3E%3Cstop offset='1' stop-color='%23E07A2C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cg fill='%232A1806' stroke='%232A1806' stroke-width='2.4' stroke-linejoin='round'%3E%3Cpath d='M6.5 7.2 13.6 6l1.3 6.3-6.2 2.6-2.9-3.4z'/%3E%3Cpath d='m17.9 6.1 7.6 1.3.2 5.8-6.9.9z'/%3E%3Cpath d='m6.2 18.6 4.3-1 5 2-1.6 6.4-7.4-.4z'/%3E%3Cpath d='m19 17.2 6.7-.9-.4 9.4-8 .4z'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("giraffe-theme")==="light"?"light":"dark";if(localStorage.getItem("giraffe-rail")==="collapsed")document.documentElement.classList.add("rail-collapsed");}catch{}</script>
  <link rel="stylesheet" href="/static/styles.css?v=20261017-savanna14">
  <script type="module" src="/static/app.js?v=20261017-savanna14"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="#new" aria-label="Giraffe home">
          <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><defs><linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7C25A"/><stop offset="1" stop-color="#E07A2C"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#brand-gradient)"/><g fill="#2A1806" stroke="#2A1806" stroke-width="2.4" stroke-linejoin="round"><path d="M6.5 7.2 13.6 6l1.3 6.3-6.2 2.6-2.9-3.4z"/><path d="m17.9 6.1 7.6 1.3.2 5.8-6.9.9z"/><path d="m6.2 18.6 4.3-1 5 2-1.6 6.4-7.4-.4z"/><path d="m19 17.2 6.7-.9-.4 9.4-8 .4z"/></g></svg>
          <span class="brand-word">giraffe</span>
          <span class="shell-version" id="suite-version">v0.1.0</span>
        </a>
        <nav class="rail-nav" aria-label="Main navigation">
          <a href="#new" id="nav-new" class="rail-new" aria-label="New run"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg><span>New run</span><kbd>N</kbd></a>
          <a href="#runs" id="nav-runs" aria-label="Run history"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 10a6.5 6.5 0 1 0 2-4.7M3.5 3.5v3h3M10 6.5V10l2.5 1.5"/></svg><span>Runs</span><span id="run-count" class="nav-count" hidden></span></a>
        </nav>
        <section class="rail-recent" id="rail-recent" aria-labelledby="rail-recent-title" hidden>
          <h2 id="rail-recent-title">Recent</h2>
          <ol id="rail-runs"></ol>
        </section>
        <div class="app-shell-footer">
          <div class="runner-indicator"><span class="connection-dot" aria-hidden="true"></span><span><strong>Local runner</strong><small id="runner-location">Your machine</small></span></div>
          <div class="rail-tools">
            <button class="rail-tool" type="button" data-action="shortcuts" aria-label="Keyboard shortcuts"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="5" width="15" height="10" rx="2"/><path d="M5.5 8h1M9.5 8h1M13.5 8h1M6.5 12h7"/></svg></button>
            <button class="rail-tool theme-toggle" type="button" data-action="theme" aria-label="Switch to light theme"></button>
          </div>
        </div>
      </div>
    </header>
    <div class="workspace">
      <div class="workspace-path">
        <button class="rail-toggle" type="button" data-action="toggle-rail" aria-label="Collapse sidebar" aria-expanded="true" title="Toggle sidebar ( [ )"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M7.5 3.5v13"/></svg></button>
        <div id="breadcrumb">New run</div>
        <a id="active-run-link" class="active-run-link" hidden></a>
        <button class="command-trigger" type="button" data-action="commands" aria-label="Open command palette"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 3.5 3.5"/></svg><span>Search runs or jump to…</span><kbd>⌘K</kbd></button>
      </div>
      <div id="connection-error" class="connection-error" role="status" hidden></div>
      <main id="main" tabindex="-1"><div class="loading">Loading local workspace…</div></main>
    </div>
  </div>
  <dialog id="command-dialog" aria-labelledby="command-title"></dialog>
  <dialog id="dataset-dialog" aria-labelledby="dataset-dialog-title"></dialog>
  <dialog id="request-dialog" aria-labelledby="request-title"></dialog>
  <dialog id="baseline-dialog" aria-labelledby="baseline-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="spot-tip" class="spot-tip" aria-hidden="true" hidden></div>
  <noscript><p>Enable JavaScript to run checks and review results in Giraffe.</p></noscript>
</body>
</html>
